appId: dev.jagra.sample
name: Wrong password shows an error
properties:
  condition: success
---
- launchApp:
    clearState: true
- tapOn: "Username"
- inputText: "demo"
- tapOn: "Password"
- inputText: "not-the-password"
- hideKeyboard
- tapOn: "Sign in"
- assertVisible: "Wrong username or password."
- assertNotVisible: "Stock"
