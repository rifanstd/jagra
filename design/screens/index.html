<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup Jagra</title>
    <link rel="stylesheet" href="../system/theme.css" />
    <link rel="stylesheet" href="mockup.css" />
    <style>
      /* The viewer: sidebar, the mockup in a desktop window, and its explanation. */
      body {
        height: 100vh;
        overflow: hidden;
      }
      .viewer {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr) 340px;
        height: 100vh;
      }
      .side {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--card);
        overflow-y: auto;
      }
      .side-head {
        padding: 18px 18px 8px;
      }
      .side-head p {
        margin-top: 2px;
        color: var(--muted-foreground);
        font-size: 0.8125rem;
      }
      .side nav {
        padding: 4px 10px 16px;
      }
      .side h2 {
        margin: 14px 8px 6px;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted-foreground);
      }
      .side ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .side a {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 7px 8px;
        border-radius: var(--r-md);
        text-decoration: none;
        color: var(--foreground);
        font-size: 0.875rem;
      }
      .side a:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .side a[aria-current="page"] {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .side a .num {
        width: 1.5em;
        text-align: right;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        opacity: 0.8;
      }
      .side-foot {
        margin-top: auto;
        padding: 14px 18px;
        border-top: 1px solid var(--border);
        display: grid;
        gap: 8px;
        font-size: 0.8125rem;
      }

      .stage {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: auto;
        background: var(--muted);
      }
      .stage-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 14px 24px;
      }
      .stage-head h1 {
        font-size: 1.125rem;
      }
      .stage-head .actions {
        margin-left: auto;
      }
      .fit {
        padding: 0 24px 24px;
        overflow: hidden;
      }
      .theme-switch {
        display: flex;
        gap: 4px;
      }
      .theme-switch button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
      }
      .theme-switch button[aria-pressed="true"] {
        background: var(--secondary);
        border-color: var(--secondary);
        color: var(--secondary-foreground);
      }
      /* A desktop window around the mockup. Its size is the app's real window, scaled to fit. */
      .window {
        width: 1280px;
        border: 1px solid var(--input);
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--background);
        box-shadow: var(--shadow-lg);
        transform-origin: top left;
      }
      .titlebar {
        display: flex;
        align-items: center;
        height: 34px;
        padding-left: 12px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        font-size: 0.8125rem;
        color: var(--muted-foreground);
        user-select: none;
      }
      .titlebar .controls {
        margin-left: auto;
        display: flex;
        height: 100%;
      }
      .titlebar .controls span {
        display: grid;
        place-items: center;
        width: 46px;
      }
      .titlebar .controls span::before {
        content: "";
        width: 10px;
        height: 10px;
        border: 1px solid var(--muted-foreground);
      }
      .titlebar .controls span.min::before {
        height: 0;
        border-width: 1px 0 0;
      }
      .titlebar .controls span.close::before {
        border: 0;
        background:
          linear-gradient(45deg, transparent 45%, var(--muted-foreground) 45%, var(--muted-foreground) 55%, transparent 55%),
          linear-gradient(-45deg, transparent 45%, var(--muted-foreground) 45%, var(--muted-foreground) 55%, transparent 55%);
      }
      .window iframe {
        display: block;
        width: 1280px;
        height: 800px;
        border: 0;
      }

      .explain {
        border-left: 1px solid var(--border);
        background: var(--card);
        overflow-y: auto;
        padding: 20px;
        display: grid;
        align-content: start;
        gap: 22px;
      }
      .explain h2 {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted-foreground);
        margin-bottom: 8px;
      }
      .explain p,
      .explain li {
        font-size: 0.875rem;
      }
      .explain ul {
        margin: 0;
        padding-left: 1.1em;
        display: grid;
        gap: 6px;
      }
      .states {
        display: grid;
        gap: 6px;
      }
      .states button {
        display: grid;
        gap: 2px;
        text-align: left;
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--background);
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
      }
      .states button span {
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
      .states button[aria-pressed="true"] {
        border-color: var(--secondary);
        box-shadow: inset 3px 0 0 var(--secondary);
      }
      .reqs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      @media (max-width: 1100px) {
        body {
          height: auto;
          overflow: auto;
        }
        .viewer {
          grid-template-columns: 220px minmax(0, 1fr);
          height: auto;
        }
        .explain {
          grid-column: 2;
          border-left: 0;
          border-top: 1px solid var(--border);
        }
      }
      @media (max-width: 700px) {
        .viewer {
          grid-template-columns: 1fr;
        }
        .explain {
          grid-column: 1;
        }
        .side {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <div class="viewer">
      <aside class="side" aria-label="Daftar layar">
        <div class="side-head">
          <strong>Mockup Jagra</strong>
          <p>Draf untuk disetujui sebelum M8</p>
        </div>
        <nav id="menu"></nav>
        <div class="side-foot">
          <span class="muted">Tampilan</span>
          <div class="theme-switch" role="group" aria-label="Mode tampilan">
            <button type="button" data-theme="light" aria-pressed="true">Terang</button>
            <button type="button" data-theme="dark" aria-pressed="false">Gelap</button>
          </div>
        </div>
      </aside>

      <main class="stage">
        <div class="stage-head">
          <h1 id="title"></h1>
          <div class="actions">
            <a class="btn btn-sm" id="open" target="_blank">Buka penuh</a>
          </div>
        </div>
        <div class="fit" id="fit">
          <div class="window" id="window">
            <div class="titlebar">
              <span>Jagra</span>
              <span class="controls" aria-hidden="true"><span class="min"></span><span class="max"></span><span class="close"></span></span>
            </div>
            <iframe id="screen" title="Mockup layar"></iframe>
          </div>
        </div>
      </main>

      <aside class="explain" id="explain" aria-label="Penjelasan layar"></aside>
    </div>

          shows: ["Daftar file yang berubah dan apa yang terjadi pada masing-masing.", "Lihat perubahan, Biarkan, Kembalikan."],

      const menu = document.getElementById("menu");
      const frame = document.getElementById("screen");
      const explain = document.getElementById("explain");
      const windowEl = document.getElementById("window");
      const fit = document.getElementById("fit");
      let theme = "light";
      let current = SCREENS[0];
      let currentState = "";

      // Sidebar
      for (const group of ["Alur utama", "Layar pendukung"]) {
        const heading = document.createElement("h2");
        heading.textContent = group;
        const list = document.createElement("ol");
        for (const screen of SCREENS.filter((s) => s.group === group)) {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = `#${screen.file}`;
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = String(SCREENS.indexOf(screen) + 1);
          link.append(num, document.createTextNode(screen.title));
          link.addEventListener("click", (event) => {
            event.preventDefault();
            show(screen.file);
          });
          item.append(link);
          list.append(item);
        }
        menu.append(heading, list);
      }

      const send = (message) => frame.contentWindow?.postMessage({ source: "jagra-viewer", ...message }, "*");

      function show(file, state) {
        current = SCREENS.find((s) => s.file === file) ?? SCREENS[0];
        currentState = state ?? current.states[0]?.[0] ?? "";
        history.replaceState(null, "", `#${current.file}`);
        if (!frame.src.endsWith(current.file)) frame.src = current.file;
        else send({ theme, state: currentState || undefined });
        render();
      }

      function render() {
        document.getElementById("title").textContent = `${SCREENS.indexOf(current) + 1}. ${current.title}`;
        document.getElementById("open").href = current.file;
        for (const link of menu.querySelectorAll("a")) {
          if (link.hash === `#${current.file}`) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        }
        explain.replaceChildren();
        const section = (title, ...content) => {
          const block = document.createElement("section");
          const heading = document.createElement("h2");
          heading.textContent = title;
          block.append(heading, ...content);
          explain.append(block);
        };
        const paragraph = (text) => {
          const p = document.createElement("p");
          p.textContent = text;
          return p;
        };
        section("Untuk apa", paragraph(current.purpose));
        if (current.states.length > 0) {
          const states = document.createElement("div");
          states.className = "states";
          for (const [id, label, detail] of current.states) {
            const button = document.createElement("button");
            button.type = "button";
            button.setAttribute("aria-pressed", String(id === currentState));
            const name = document.createElement("strong");
            name.textContent = label;
            button.append(name);
            if (detail) {
              const small = document.createElement("span");
              small.textContent = detail;
              button.append(small);
            }
            button.addEventListener("click", () => {
              currentState = id;
              send({ state: id });
              render();
            });
            states.append(button);
          }
          section("Keadaan yang bisa dilihat", states);
        }
        const list = document.createElement("ul");
        for (const line of current.shows) {
          const item = document.createElement("li");
          item.textContent = line;
          list.append(item);
        }
        section("Isi layar", list);
        if (current.note) section("Catatan", paragraph(current.note));
        const reqs = document.createElement("div");
        reqs.className = "reqs";
        for (const id of current.reqs) {
          const chip = document.createElement("span");
          chip.className = "chip mono";
          chip.textContent = id;
          reqs.append(chip);
        }
        section("Persyaratan di spec", reqs);
      }

      // The mockup reports which screen it shows when a button inside it leads elsewhere.
      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.source !== "jagra-mockup") return;
        if (data.file && data.file !== current.file) {
          current = SCREENS.find((s) => s.file === data.file) ?? current;
          currentState = current.states[0]?.[0] ?? "";
          history.replaceState(null, "", `#${current.file}`);
          render();
        }
        if (data.file) send({ theme, state: currentState || undefined });
        if (data.state && data.state !== currentState) {
          currentState = data.state;
          render();
        }
      });

      // Light or dark mode for the viewer and the mockup together (SET-2 follows the system in the app).
      for (const button of document.querySelectorAll("[data-theme]")) {
        button.addEventListener("click", () => {
          theme = button.dataset.theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
          for (const other of document.querySelectorAll("[data-theme]")) {
            other.setAttribute("aria-pressed", String(other === button));
          }
          send({ theme });
        });
      }

      // The app's window is 1280 by 800; it is scaled down to fit the middle column.
      const scale = () => {
        const available = fit.clientWidth - 48;
        const factor = Math.min(1, available / 1280);
        windowEl.style.transform = `scale(${factor})`;
        fit.style.height = `${(800 + 36) * factor + 24}px`;
      };
      new ResizeObserver(scale).observe(fit);

      show(location.hash.slice(1) || SCREENS[0].file);
    </script>
  </body>
</html>
